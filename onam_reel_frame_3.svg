<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad_3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="60%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Golden Rim Light -->
    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Uploaded Fabric Pattern -->
    <pattern id="fabric_pattern_3" patternUnits="userSpaceOnUse" width="180" height="180">
      <image href="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&amp;auto=format&amp;fit=crop&amp;q=80" x="0" y="0" width="180" height="180" preserveAspectRatio="xMidYMid slice" />
    </pattern>

    <!-- Fabric Shading Overlay -->
    <linearGradient id="fabricShading" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.05" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow_3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Clip Path for Model Head/Face -->
    <clipPath id="faceClip">
      <circle cx="360" cy="260" r="130" />
    </clipPath>
  </defs>

  <!-- 1. Studio Background -->
  <rect width="720" height="1280" fill="url(#bgGrad_3)" />

  <!-- Ambient Light Bokeh Circles -->
  <circle cx="120" cy="180" r="140" fill="#fbbf24" opacity="0.08" filter="blur(40px)" />
  <circle cx="620" cy="400" r="180" fill="#f43f5e" opacity="0.06" filter="blur(50px)" />
  <circle cx="360" cy="900" r="220" fill="#fbbf24" opacity="0.05" filter="blur(60px)" />

  <!-- Background Pillars / Studio Depth Lines -->
  <line x1="80" y1="0" x2="80" y2="1280" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2" />
  <line x1="640" y1="0" x2="640" y2="1280" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2" />
  <circle cx="360" cy="380" r="300" stroke="url(#goldRim)" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="8 8" />

  <!-- 2. MODEL BODY &amp; TAILORED GARMENT COMPOSITE -->
  <g filter="url(#shadow_3)">

    
      <!-- MEN'S SHIRTING TAILORED FIT DRAPE -->
      <!-- Lower Body: Traditional Kerala Kasavu Mundu (Gold Border) or Dark Chinos -->
      <path d="M 220 840 L 500 840 L 530 1200 L 190 1200 Z" fill="#fafaf9" stroke="#e5e5e5" stroke-width="2"/>
      <!-- Kasavu Gold Zari Border on Mundu -->
      <rect x="190" y="1120" width="340" height="40" fill="#d97706" opacity="0.85"/>
      <line x1="190" y1="1125" x2="530" y2="1125" stroke="#fef08a" stroke-width="4"/>
      <line x1="190" y1="1155" x2="530" y2="1155" stroke="#fef08a" stroke-width="2"/>
      <!-- Mundu Pleat Shadow -->
      <path d="M 340 840 L 370 1200 L 390 1200 L 360 840 Z" fill="#000000" opacity="0.08"/>

      <!-- TAILORED SHIRT TORSO (Wearing the uploaded fabric!) -->
      <!-- Main Shirt Body -->
      <path d="M 230 380 Q 360 400 490 380 L 520 860 Q 360 880 200 860 Z" fill="url(#fabric_pattern_3)" />
      <!-- Fabric Depth Shading on Torso -->
      <path d="M 230 380 Q 360 400 490 380 L 520 860 Q 360 880 200 860 Z" fill="url(#fabricShading)" mix-blend-mode="multiply" />

      <!-- Left Sleeve -->
      <path d="M 230 380 L 130 640 L 190 670 L 250 560 Z" fill="url(#fabric_pattern_3)" />
      <path d="M 230 380 L 130 640 L 190 670 L 250 560 Z" fill="#000000" opacity="0.2" />
      <!-- Sleeve Cuff -->
      <rect x="130" y="630" width="60" height="24" rx="4" fill="url(#fabric_pattern_3)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>

      <!-- Right Sleeve -->
      <path d="M 490 380 L 590 640 L 530 670 L 470 560 Z" fill="url(#fabric_pattern_3)" />
      <path d="M 490 380 L 590 640 L 530 670 L 470 560 Z" fill="#000000" opacity="0.2" />
      <!-- Right Sleeve Cuff -->
      <rect x="530" y="630" width="60" height="24" rx="4" fill="url(#fabric_pattern_3)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>

      <!-- Front Placket (Center Button Strip) -->
      <rect x="345" y="390" width="30" height="430" fill="url(#fabric_pattern_3)" stroke="#000000" stroke-opacity="0.2" stroke-width="1"/>
      <line x1="360" y1="390" x2="360" y2="860" stroke="#000000" stroke-opacity="0.25" stroke-dasharray="2 4"/>

      <!-- Mother-of-Pearl Buttons -->
      <circle cx="360" cy="430" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="360" cy="510" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="360" cy="590" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="360" cy="670" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="360" cy="750" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

      <!-- Tailored Collar (Crisp Spread or Cuban) -->
      <!-- Left Collar Wing -->
      <path d="M 310 360 L 260 430 L 345 410 Z" fill="url(#fabric_pattern_3)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
      <!-- Right Collar Wing -->
      <path d="M 410 360 L 460 430 L 375 410 Z" fill="url(#fabric_pattern_3)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
      <!-- Collar Seam Shadows -->
      <path d="M 310 360 L 360 390 L 410 360 Z" fill="#000000" opacity="0.3"/>

      <!-- Chest Pocket (Bespoke Tailoring Touch) -->
      <path d="M 260 520 L 315 520 L 315 580 L 287 600 L 260 580 Z" fill="url(#fabric_pattern_3)" stroke="#000000" stroke-opacity="0.25" stroke-width="1.5"/>
    

    <!-- 3. NATIVE KERALA MODEL FACE &amp; HEAD (High Resolution Avatar Portrait) -->
    <!-- Model Neck -->
    <rect x="330" y="340" width="60" height="50" fill="#9a3412" rx="10" opacity="0.8"/>
    <!-- Face Avatar Image with Circular Clip &amp; Gold Ring -->
    <circle cx="360" cy="240" r="120" fill="#1c1917" stroke="#fbbf24" stroke-width="3"/>
    <g clip-path="url(#faceClip)">
      <image href="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&amp;auto=format&amp;fit=crop&amp;q=80" x="220" y="100" width="280" height="280" preserveAspectRatio="xMidYMid slice" />
    </g>
    <!-- Soft Golden Studio Ambient Glow on Model's Face -->
    <circle cx="360" cy="240" r="120" fill="url(#goldRim)" opacity="0.15" pointer-events="none" />
  </g>

  <!-- 4. SIGNATURE BRAND POSE BONUS: Model holding raw fabric swatch roll (Shot 5) -->
  

  <!-- 5. INSET PRODUCT PIP BADGE (Proof of Real Uploaded Fabric) -->
  <g transform="translate(480, 40)" filter="url(#shadow_3)">
    <rect width="200" height="130" rx="14" fill="#09090b" stroke="#fbbf24" stroke-width="2" />
    <!-- Fabric thumbnail -->
    <clipPath id="thumbClip_3">
      <rect x="8" y="8" width="184" height="88" rx="8" />
    </clipPath>
    <g clip-path="url(#thumbClip_3)">
      <image href="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&amp;auto=format&amp;fit=crop&amp;q=80" x="8" y="8" width="184" height="88" preserveAspectRatio="xMidYMid slice" />
    </g>
    <!-- Badge Label -->
    <rect x="8" y="100" width="184" height="22" rx="4" fill="#18181b" />
    <circle cx="22" cy="111" r="4" fill="#10b981" />
    <text x="32" y="115" fill="#fef08a" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="800">ORIGINAL WEAVE</text>
  </g>

  <!-- 6. HIGH FASHION ADVERTISEMENT OVERLAYS -->
  <!-- Top Kerala Retail Brand Header -->
  <g transform="translate(40, 40)">
    <rect width="280" height="54" rx="12" fill="#09090b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <text x="18" y="24" fill="#f59e0b" font-size="12" font-family="system-ui, sans-serif" font-weight="900" letter-spacing="1">LAKSHMI SILKS EXCLUSIVE</text>
    <text x="18" y="42" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" font-weight="600">Rahul Kurup • Tailored Shirt</text>
  </g>

  <!-- Bottom Fashion Angle &amp; Spec Title -->
  <g transform="translate(40, 1150)">
    <rect width="640" height="84" rx="16" fill="#09090b" fill-opacity="0.9" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- Angle Tag -->
    <rect x="18" y="16" width="110" height="22" rx="6" fill="#d97706" />
    <text x="73" y="31" fill="#ffffff" font-size="10" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="0.5">ANGLE 3/5</text>
    <text x="140" y="32" fill="#ffffff" font-size="15" font-family="system-ui, sans-serif" font-weight="800">Krishna &amp; Peacock Feather Printed Cotton</text>

    <!-- Specs Row -->
    <text x="18" y="64" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" font-weight="500">
      <tspan fill="#fef08a" font-weight="700">Fabric:</tspan> Premium 60s Combed Cotton • <tspan fill="#34d399" font-weight="700">Fidelity: 98%</tspan>
    </text>
  </g>
</svg>
