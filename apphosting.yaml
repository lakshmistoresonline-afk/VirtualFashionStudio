kind: "AppStack"
apiVersion: "v1"
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512
env:
  - variable: "NODE_ENV"
    value: "production"
  - variable: "PORT"
    value: "3000"
  - variable: "AI_MODE"
    value: "live"
secrets:
  - variable: "GEMINI_API_KEY"
    secret: "GEMINI_API_KEY"
